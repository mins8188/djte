<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>개발자 소개</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; color: #222; line-height: 1.6; }
    header { text-align: center; margin-bottom: 32px; }
    .avatar { width: 120px; height: 120px; border-radius: 50%; background: #eaeaea; display: inline-block; }
    h1 { margin-top: 16px; font-size: 24px; }
    .title { color: #666; font-size: 14px; }
    section { margin: 24px 0; }
    h2 { font-size: 18px; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 12px; }
    ul { list-style: none; }
    li { padding: 6px 0; }
    .links a { margin-right: 12px; color: #0066cc; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <span class="avatar" aria-hidden="true"></span>
    <h1>이름</h1>
    <p class="title">개발자</p>
  </header>

  <section>
    <h2>소개</h2>
    <p>안녕하세요. 저는 개발자입니다. 이곳은 제 소개 페이지입니다.</p>
  </section>

  <section>
    <h2>기술 스택</h2>
    <ul>
      <li>JavaScript / TypeScript</li>
      <li>Python</li>
      <li>HTML / CSS</li>
    </ul>
  </section>

  <section>
    <h2>연락처</h2>
    <p class="links">
      <a href="mailto:email@example.com">Email</a>
      <a href="https://github.com/username" target="_blank" rel="noopener">GitHub</a>
    </p>
  </section>
</body>
</html>
